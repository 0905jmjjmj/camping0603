<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏕️ 1박 캠핑 준비물</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;background:#f5f5f3;min-height:100vh;padding:16px;}
.wrap{max-width:540px;margin:0 auto;}

/* ── 설정 배너 ── */
#setup-banner{background:#FFF8E1;border:1px solid #FFD54F;border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:13px;color:#5D4037;line-height:1.7;display:none;}
#setup-banner b{font-weight:600;}
#setup-banner input{width:100%;margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid #FFD54F;font-size:13px;font-family:inherit;}
#setup-banner button{margin-top:8px;padding:7px 16px;border-radius:8px;border:none;background:#FFB300;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}

/* ── 헤더 ── */
.header{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;border:1px solid #e8e6e0;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.title{font-size:16px;font-weight:600;color:#1a1a1a;}
.reset-btn{font-size:12px;color:#888;background:none;border:1px solid #ddd;border-radius:8px;padding:5px 11px;cursor:pointer;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#555;}
.leg-dot{width:9px;height:9px;border-radius:50%;}
.leg-hint{font-size:11px;color:#aaa;width:100%;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tab{padding:6px 14px;border-radius:99px;border:1px solid #ddd;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:#888;transition:all .15s;}
.tab.active-전체{background:#444441;color:#fff;border-color:#444441;}
.tab.active-은영{background:#534AB7;color:#fff;border-color:#534AB7;}
.tab.active-미정{background:#0F6E56;color:#fff;border-color:#0F6E56;}
.prog-bg{height:6px;background:#eee;border-radius:99px;margin-bottom:5px;}
.prog-fill{height:6px;border-radius:99px;transition:width .4s;}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;}
.stat{font-size:12px;color:#888;}
.stat b{font-weight:600;}
.sync-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.sync-status{font-size:11px;color:#aaa;height:14px;}
.sync-btn{font-size:11px;color:#888;background:none;border:1px solid #ddd;border-radius:6px;padding:3px 9px;cursor:pointer;}

/* ── 카테고리 카드 ── */
.cat-card{background:#fff;border-radius:14px;margin-bottom:10px;border:1px solid #e8e6e0;overflow:hidden;}
.cat-head{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;background:#fafaf8;border-bottom:1px solid #e8e6e0;}
.cat-icon{font-size:15px;}
.cat-head-title{font-size:13px;font-weight:600;flex:1;color:#1a1a1a;}
.cat-head-count{font-size:12px;color:#aaa;}
.cat-chevron{font-size:13px;color:#bbb;transition:transform .2s;display:inline-block;}
.cat-card.open .cat-chevron{transform:rotate(180deg);}
.cat-body{display:none;}
.cat-card.open .cat-body{display:block;}

/* ── 아이템 ── */
.item{display:flex;align-items:center;border-bottom:1px solid #f0ede8;}
.item:last-child{border-bottom:none;}
.item-left{display:flex;align-items:center;gap:10px;flex:1;padding:9px 14px;min-width:0;}
.item-icon{font-size:17px;flex-shrink:0;}
.item-text-col{flex:1;min-width:0;}
.item-label{font-size:13px;color:#1a1a1a;line-height:1.4;}
.item-label.striked{color:#bbb;text-decoration:line-through;}
.item-badges{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;}
.badge-must{background:#FAECE7;color:#993C1D;}
.badge-personal{background:#E6F1FB;color:#185FA5;}
.badge-kids{background:#EAF3DE;color:#3B6D11;}

/* ── 담당자 버튼 ── */
.assign-col{display:flex;flex-direction:column;gap:3px;padding:8px 12px 8px 0;flex-shrink:0;}
.person-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1.5px solid #e0e0e0;cursor:pointer;font-size:12px;font-weight:500;background:#fff;color:#ccc;transition:all .15s;font-family:inherit;}
.person-btn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.person-btn.sel-은영{background:#EEEDFE;color:#3C3489;border-color:#534AB7;}
.person-btn.sel-미정{background:#E1F5EE;color:#085041;border-color:#0F6E56;}
.person-btn.done-은영{background:#534AB7;color:#fff;border-color:#534AB7;}
.person-btn.done-미정{background:#0F6E56;color:#fff;border-color:#0F6E56;}

/* ── 로딩 ── */
#loading{text-align:center;padding:40px;color:#aaa;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- 최초 설정 배너 -->
  <div id="setup-banner">
    <b>⚙️ 첫 설정 필요</b><br>
    아래 가이드에 따라 Google Apps Script URL을 입력해주세요.<br>
    한 명만 설정하면 나머지는 URL만 입력하면 돼요.
    <input id="gas-url-input" type="text" placeholder="https://script.google.com/macros/s/...../exec">
    <button onclick="saveGasUrl()">저장하고 시작</button>
  </div>

  <div class="header">
    <div class="header-top">
      <span class="title">🏕️ 1박 캠핑 준비물 · 어린이 4 + 어른 4</span>
      <button class="reset-btn" onclick="resetAll()">↺ 초기화</button>
    </div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#534AB7"></div>은영</div>
      <div class="leg"><div class="leg-dot" style="background:#0F6E56"></div>미정</div>
      <span class="leg-hint">이름 1번 탭 = 담당 &nbsp;·&nbsp; 2번 탭 = ✓챙김완료 &nbsp;·&nbsp; 3번 탭 = 취소</span>
    </div>
    <div class="tabs">
      <div class="tab active-전체" data-who="전체" onclick="setWho('전체')">🗂 전체</div>
      <div class="tab" data-who="은영" onclick="setWho('은영')">은영</div>
      <div class="tab" data-who="미정" onclick="setWho('미정')">미정</div>
    </div>
    <div class="prog-bg"><div class="prog-fill" id="bar" style="width:0%;background:#444441"></div></div>
    <div class="stat-row" id="stats"></div>
    <div class="sync-row">
      <span class="sync-status" id="syncStatus">불러오는 중...</span>
      <button class="sync-btn" onclick="loadFromSheet()">🔄 새로고침</button>
    </div>
  </div>

  <div id="loading">데이터 불러오는 중...</div>
  <div id="cats" style="display:none"></div>
</div>

<script>
/* ════════════════════════════════
   데이터 정의
════════════════════════════════ */
const PEOPLE=["은영","미정"];
const COLORS={은영:"#534AB7",미정:"#0F6E56",전체:"#444441"};

const DATA=[
  {id:"sleep",icon:"⛺",title:"텐트 / 잠자리",items:[
    {t:"8인 취침 가능한 텐트",must:true},
    {t:"그라운드시트",must:true},
    {t:"팩 · 여분 팩 · 팩망치",must:true},
    {t:"타프 / 쉘터"},
    {t:"매트 / 에어매트",must:true},
    {t:"에어펌프"},
    {t:"침낭 또는 이불 8명분",must:true},
    {t:"베개 8개",must:true},
    {t:"어린이 담요 2~3장",kids:true},
    {t:"어린이 애착이불 / 인형",kids:true},
  ]},
  {id:"living",icon:"💡",title:"생활 / 전기",items:[
    {t:"캠핑의자 8개 (어린이용 포함)",must:true},
    {t:"테이블 2개 (식사용·조리용)",must:true},
    {t:"랜턴 2~3개",must:true},
    {t:"손전등 / 헤드랜턴"},
    {t:"보조배터리 & 충전선",must:true},
    {t:"릴선 & 멀티탭 (전기 사이트)"},
    {t:"휴지 & 물티슈 & 키친타월",must:true},
    {t:"종량제봉투 & 비닐봉투 & 지퍼백",must:true},
  ]},
  {id:"food",icon:"🍳",title:"먹거리 / 취사",items:[
    {t:"버너 & 부탄가스 여분",must:true},
    {t:"불판 / 그리들",must:true},
    {t:"냄비 1개",must:true},
    {t:"집게 2개 & 가위 2개",must:true},
    {t:"칼 & 도마",must:true},
    {t:"접시·그릇·컵 8명분",must:true},
    {t:"수저·젓가락·어린이 식기",must:true},
    {t:"아이스박스 & 아이스팩",must:true},
    {t:"생수 & 음료 & 커피",must:true},
    {t:"주방세제 & 수세미",must:true},
    {t:"호일 & 일회용 장갑 & 소스류"},
    {t:"저녁: 고기·소시지·햇반·김·어린이 반찬",must:true},
    {t:"야식: 라면 & 간식"},
    {t:"아침: 빵·계란·누룽지",must:true},
    {t:"주류"},
    {t:"후라이팬"},
    {t:"마른안주"},
  ]},
  {id:"kids",icon:"🧒",title:"어린이 4명 (4~6세)",items:[
    {t:"여벌옷 1인당 2벌 이상",must:true,personal:true,kids:true},
    {t:"잠옷 & 밤 보온옷",must:true,personal:true,kids:true},
    {t:"양말 & 속옷 여분",must:true,personal:true,kids:true},
    {t:"어린이 칫솔 & 치약 & 로션",personal:true,kids:true},
    {t:"복용약 & 해열제 & 체온계",must:true,kids:true},
    {t:"어린이 선크림 & 모기기피제",must:true,kids:true},
    {t:"어린이 물병 & 주스 & 우유",must:true,kids:true},
    {t:"어린이 간식 넉넉하게",must:true,kids:true},
    {t:"비눗방울 & 공 & 카드게임 & 색칠놀이",kids:true},
    {t:"이름표 / 연락처 팔찌",kids:true},
  ]},
  {id:"personal",icon:"🧴",title:"옷 / 세면 / 개인용품",items:[
    {t:"어른 여벌옷 & 잠옷 & 겉옷",must:true,personal:true},
    {t:"세면도구 & 수건 & 슬리퍼",must:true,personal:true},
    {t:"모자 & 선크림",must:true,personal:true},
    {t:"핸드폰 & 보조배터리",must:true,personal:true},
    {t:"현금 & 카드",must:true,personal:true},
    {t:"평소 먹는 약",personal:true},
    {t:"우산 & 우비 (비 예보 시)"},
  ]},
  {id:"safety",icon:"🩹",title:"안전 / 응급",items:[
    {t:"구급상자 & 밴드 & 소독약",must:true},
    {t:"모기기피제 & 모기향 & 전기모기채",must:true},
    {t:"손소독제",must:true},
    {t:"아이스팩"},
  ]},
  {id:"fire",icon:"🔥",title:"불멍 (선택)",items:[
    {t:"화로대 & 방염매트"},
    {t:"장작 & 착화제"},
    {t:"토치 & 라이터"},
    {t:"내열장갑 & 불멍 집게"},
    {t:"마시멜로"},
  ]},
];

/* ════════════════════════════════
   GAS URL 관리
════════════════════════════════ */
const GAS_KEY="camping_gas_url";
let GAS_URL="https://script.google.com/macros/s/AKfycbyvwGWMVZ50Oo_BwBkho2HelyZtVJC5HS9-sBuiUv9gsbc2X9FoutZ5o1K-mbrEzZDa/exec";

function saveGasUrl(){
  const v=document.getElementById("gas-url-input").value.trim();
  if(!v){alert("URL을 입력해주세요.");return;}
  GAS_URL=v;
  localStorage.setItem(GAS_KEY,v);
  document.getElementById("setup-banner").style.display="none";
  loadFromSheet();
}

/* ════════════════════════════════
   상태
════════════════════════════════ */
let state={};
let who="전체";
let saveTimer=null;
let dirtyChanges={};

function ikey(catId,t){return catId+"||"+t;}
function getP(k){return(state[k]&&state[k].persons)||{은영:0,미정:0};}
function anyAssigned(k){return PEOPLE.some(n=>getP(k)[n]>=1);}
function allDone(k){const p=getP(k);const a=PEOPLE.filter(n=>p[n]>=1);return a.length>0&&a.every(n=>p[n]===2);}

/* ════════════════════════════════
   Google Sheets 연동
════════════════════════════════ */
async function loadFromSheet(){
  if(!GAS_URL){
    document.getElementById("setup-banner").style.display="block";
    document.getElementById("loading").style.display="none";
    document.getElementById("cats").style.display="block";
    setSyncStatus("⚠️ URL 미설정");
    render();
    return;
  }
  setSyncStatus("🔄 불러오는 중...");
  try{
    const res=await fetch(GAS_URL+"?action=get");
    const json=await res.json();
    if(json.data) state=json.data;
    document.getElementById("loading").style.display="none";
    document.getElementById("cats").style.display="block";
    setSyncStatus("✓ "+timeStr()+" 기준");
    render();
  }catch(e){
    document.getElementById("loading").style.display="none";
    document.getElementById("cats").style.display="block";
    setSyncStatus("❌ 불러오기 실패 (오프라인?)");
    render();
  }
}

async function saveToSheet(forceReplace=false){
  if(!GAS_URL) return;
  setSyncStatus("💾 저장 중...");
  try{
    if(!forceReplace){
      const pending=JSON.parse(JSON.stringify(dirtyChanges));
      const latestRes=await fetch(GAS_URL+"?action=get&_="+Date.now());
      const latestJson=await latestRes.json();
      const merged=latestJson.data||{};
      Object.keys(pending).forEach(k=>{
        if(!merged[k]) merged[k]={persons:{은영:0,미정:0}};
        if(!merged[k].persons) merged[k].persons={은영:0,미정:0};
        Object.keys(pending[k]).forEach(person=>{
          merged[k].persons[person]=pending[k][person];
        });
      });
      state=merged;
      Object.keys(pending).forEach(k=>{
        Object.keys(pending[k]).forEach(person=>{
          if(dirtyChanges[k]&&dirtyChanges[k][person]===pending[k][person]) delete dirtyChanges[k][person];
        });
        if(dirtyChanges[k]&&Object.keys(dirtyChanges[k]).length===0) delete dirtyChanges[k];
      });
    }
    await fetch(GAS_URL,{
      method:"POST",
      body:JSON.stringify({action:"set",data:state}),
    });
    setSyncStatus("✓ "+timeStr()+" 저장됨");
    render();
  }catch(e){
    setSyncStatus("❌ 저장 실패");
  }
}

function setSyncStatus(msg){
  document.getElementById("syncStatus").textContent=msg;
}
function timeStr(){
  const d=new Date();
  return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");
}

/* ════════════════════════════════
   인터랙션
════════════════════════════════ */
function setWho(w){
  who=w;
  document.querySelectorAll(".tab").forEach(t=>{
    t.className="tab";
    if(t.dataset.who===w) t.classList.add("active-"+w);
  });
  render();
}

function cyclePerson(catId,t,person){
  const k=ikey(catId,t);
  if(!state[k]) state[k]={persons:{은영:0,미정:0}};
  if(!state[k].persons) state[k].persons={은영:0,미정:0};
  state[k].persons[person]=((state[k].persons[person]||0)+1)%3;
  if(!dirtyChanges[k]) dirtyChanges[k]={};
  dirtyChanges[k][person]=state[k].persons[person];
  render();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveToSheet,800);
}

function resetAll(){
  if(!confirm("초기화하면 모든 담당 및 체크가 사라집니다. 계속할까요?"))return;
  state={};
  dirtyChanges={};
  render();
  saveToSheet(true);
}

/* ════════════════════════════════
   렌더링
════════════════════════════════ */
function render(){
  const cats=document.getElementById("cats");
  cats.innerHTML="";
  let total=0,totalDone=0;
  const pp={은영:{t:0,d:0},미정:{t:0,d:0}};

  DATA.forEach(cat=>{
    const filteredItems=cat.items.filter(item=>{
      if(who==="전체")return true;
      return getP(ikey(cat.id,item.t))[who]>=1;
    });
    if(who!=="전체"&&filteredItems.length===0)return;

    cat.items.forEach(item=>{
      const k=ikey(cat.id,item.t);
      const p=getP(k);
      PEOPLE.forEach(name=>{if(p[name]>=1){pp[name].t++;if(p[name]===2)pp[name].d++;}});
      if(anyAssigned(k)){total++;if(allDone(k))totalDone++;}
    });

    const showItems=who==="전체"?cat.items:filteredItems;
    const catDone=showItems.filter(i=>allDone(ikey(cat.id,i.t))).length;

    const card=document.createElement("div");
    card.className="cat-card open";

    const itemsHtml=showItems.map(item=>{
      const k=ikey(cat.id,item.t);
      const p=getP(k);
      const isDone=allDone(k);
      const hasAny=anyAssigned(k);
      const doneIcon=isDone?"✅":(hasAny?"🔲":"⬜");

      const badges=[];
      if(item.must) badges.push('<span class="badge badge-must">필수</span>');
      if(item.personal) badges.push('<span class="badge badge-personal">개인별 각자</span>');
      if(item.kids) badges.push('<span class="badge badge-kids">아이용</span>');

      const safeT=item.t.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
      const personBtns=PEOPLE.map(name=>{
        const v=p[name]||0;
        let cls="person-btn";
        let label=name;
        if(v===1){cls+=" sel-"+name;label=name+" 담당";}
        else if(v===2){cls+=" done-"+name;label=name+" ✓챙김";}
        const op=v===0?0.25:1;
        return `<button class="${cls}" onclick="cyclePerson('${cat.id}','${safeT}','${name}')">
          <span class="dot" style="background:${COLORS[name]};opacity:${op}"></span>${label}
        </button>`;
      }).join("");

      return `<div class="item">
        <div class="item-left">
          <span class="item-icon">${doneIcon}</span>
          <div class="item-text-col">
            <div class="item-label${isDone?" striked":""}">${item.t}</div>
            ${badges.length?`<div class="item-badges">${badges.join("")}</div>`:""}
          </div>
        </div>
        <div class="assign-col">${personBtns}</div>
      </div>`;
    }).join("");

    card.innerHTML=`
      <div class="cat-head" onclick="const c=this.closest('.cat-card');c.classList.toggle('open');this.querySelector('.cat-chevron').style.transform=c.classList.contains('open')?'rotate(180deg)':'rotate(0deg)'">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-head-title">${cat.title}</span>
        <span class="cat-head-count">${catDone}/${showItems.length} 완료</span>
        <span class="cat-chevron" style="display:inline-block;transform:rotate(180deg)">▾</span>
      </div>
      <div class="cat-body">${itemsHtml}</div>`;
    cats.appendChild(card);
  });

  const pct=total?Math.round(totalDone/total*100):0;
  document.getElementById("bar").style.cssText=`width:${pct}%;background:${COLORS[who]}`;
  document.getElementById("stats").innerHTML=
    `<div class="stat">전체 <b>${totalDone}/${total}</b> (${pct}%)</div>`+
    PEOPLE.map(p=>`<div class="stat"><span style="color:${COLORS[p]};font-weight:600">${p}</span> ${pp[p].d}/${pp[p].t}</div>`).join("");
}

/* ── 시작 ── */
loadFromSheet();
</script>
</body>
</html>
