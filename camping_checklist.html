<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☀️ 당일치기 캠핑 준비물</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;background:#f5f5f3;min-height:100vh;padding:16px;}
.wrap{max-width:520px;margin:0 auto;}
.header{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;border:1px solid #e8e6e0;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.title{font-size:16px;font-weight:600;color:#1a1a1a;}
.reset-btn{font-size:12px;color:#888;background:none;border:1px solid #ddd;border-radius:8px;padding:5px 11px;cursor:pointer;}
.reset-btn:active{background:#f0f0f0;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#555;}
.leg-dot{width:9px;height:9px;border-radius:50%;}
.leg-hint{font-size:11px;color:#aaa;width:100%;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tab{padding:6px 14px;border-radius:99px;border:1px solid #ddd;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:#888;transition:all .15s;}
.tab.active-all{background:#444441;color:#fff;border-color:#444441;}
.tab.active-보라{background:#534AB7;color:#fff;border-color:#534AB7;}
.tab.active-승주{background:#0F6E56;color:#fff;border-color:#0F6E56;}
.tab.active-미정{background:#993C1D;color:#fff;border-color:#993C1D;}
.prog-bg{height:6px;background:#eee;border-radius:99px;margin-bottom:4px;}
.prog-fill{height:6px;border-radius:99px;transition:width .3s;}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;}
.stat{font-size:12px;color:#888;}
.stat b{font-weight:600;}
.save-status{font-size:11px;color:#aaa;height:14px;margin-top:4px;}

.cat-card{background:#fff;border-radius:14px;margin-bottom:10px;border:1px solid #e8e6e0;overflow:hidden;}
.cat-head{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;background:#fafaf8;border-bottom:1px solid #e8e6e0;}
.cat-icon{font-size:15px;}
.cat-head-title{font-size:13px;font-weight:600;flex:1;color:#1a1a1a;}
.cat-head-count{font-size:12px;color:#aaa;}
.cat-chevron{font-size:12px;color:#bbb;transition:transform .2s;}
.cat-card.open .cat-chevron{transform:rotate(180deg);}
.cat-body{display:none;}
.cat-card.open .cat-body{display:block;}

.item{display:flex;align-items:center;border-bottom:1px solid #f0ede8;}
.item:last-child{border-bottom:none;}
.item-left{display:flex;align-items:center;gap:10px;flex:1;padding:9px 14px;min-width:0;}
.item-icon{font-size:17px;flex-shrink:0;}
.item-text-col{flex:1;min-width:0;}
.item-label{font-size:13px;color:#1a1a1a;line-height:1.4;}
.item-label.striked{color:#bbb;text-decoration:line-through;}
.item-badges{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;}
.badge-must{background:#FAECE7;color:#993C1D;}
.badge-personal{background:#E6F1FB;color:#185FA5;}
.badge-kids{background:#EAF3DE;color:#3B6D11;}

.assign-col{display:flex;flex-direction:column;gap:3px;padding:8px 12px 8px 0;flex-shrink:0;}
.person-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1.5px solid #ddd;cursor:pointer;font-size:12px;font-weight:500;background:#fff;color:#bbb;transition:all .15s;font-family:inherit;}
.person-btn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.person-btn.idle{border-color:#e8e6e0;color:#ccc;}
.person-btn.sel-보라{background:#EEEDFE;color:#3C3489;border-color:#534AB7;}
.person-btn.sel-승주{background:#E1F5EE;color:#085041;border-color:#0F6E56;}
.person-btn.sel-미정{background:#FAECE7;color:#993C1D;border-color:#993C1D;}
.person-btn.done-보라{background:#534AB7;color:#fff;border-color:#534AB7;}
.person-btn.done-승주{background:#0F6E56;color:#fff;border-color:#0F6E56;}
.person-btn.done-미정{background:#993C1D;color:#fff;border-color:#993C1D;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-top">
      <span class="title">☀️ 당일치기 캠핑 준비물</span>
      <button class="reset-btn" onclick="resetAll()">↺ 초기화</button>
    </div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#534AB7"></div>보라</div>
      <div class="leg"><div class="leg-dot" style="background:#0F6E56"></div>승주</div>
      <div class="leg"><div class="leg-dot" style="background:#993C1D"></div>미정</div>
      <span class="leg-hint">이름 1번 탭 = 담당 &nbsp;·&nbsp; 2번 탭 = ✓챙김완료 &nbsp;·&nbsp; 3번 탭 = 취소</span>
    </div>
    <div class="tabs">
      <div class="tab active-all" data-who="전체" onclick="setWho('전체')">🗂 전체</div>
      <div class="tab" data-who="보라" onclick="setWho('보라')">보라</div>
      <div class="tab" data-who="승주" onclick="setWho('승주')">승주</div>
      <div class="tab" data-who="미정" onclick="setWho('미정')">미정</div>
    </div>
    <div class="prog-bg"><div class="prog-fill" id="bar" style="width:0%;background:#444441"></div></div>
    <div class="stat-row" id="stats"></div>
    <div class="save-status" id="saveStatus"></div>
  </div>
  <div id="cats"></div>
</div>

<script>
const PEOPLE=["보라","승주","미정"];
const COLORS={보라:"#534AB7",승주:"#0F6E56",미정:"#993C1D",전체:"#444441"};
const DOTCOLORS={보라:"#534AB7",승주:"#0F6E56",미정:"#993C1D"};

const DATA=[
  {id:"food",icon:"🍳",title:"먹거리 / 취사",items:[
    {t:"버너 & 가스",must:true},
    {t:"코펠 / 냄비",must:true},
    {t:"일회용 식기 (그릇·컵·수저·젓가락)",must:true},
    {t:"일회용 비닐장갑"},
    {t:"식재료 & 양념",must:true},
    {t:"간식 & 과일",must:true},
    {t:"물통 & 식수",must:true},
    {t:"쿨러 + 얼음"},
    {t:"키친타월",must:true},
    {t:"지퍼백 & 비닐봉지"},
  ]},
  {id:"shade",icon:"⛺",title:"쉬는 공간",items:[
    {t:"그늘막 / 파라솔",must:true},
    {t:"그늘막 펙 & 폴대",must:true},
    {t:"캠핑 의자",must:true},
    {t:"캠핑 테이블",must:true},
    {t:"돗자리 / 피크닉 매트",must:true},
  ]},
  {id:"swim",icon:"🏊",title:"수영장 놀이",items:[
    {t:"수영복",must:true,personal:true},
    {t:"래쉬가드",must:true,personal:true},
    {t:"수경",personal:true},
    {t:"수영 튜브 / 부기보드"},
    {t:"물총"},
    {t:"아쿠아슈즈",personal:true},
    {t:"방수 파우치"},
    {t:"여분 속옷 & 옷",must:true,personal:true},
    {t:"수건 (대형)",must:true,personal:true},
  ]},
  {id:"sand",icon:"🏖️",title:"모래놀이",items:[
    {t:"모래놀이 세트 (삽·틀·양동이)",must:true,kids:true},
    {t:"모래놀이용 구형 옷"},
    {t:"물 뿌리개",kids:true},
    {t:"모래 방지 매트"},
  ]},
  {id:"kids",icon:"🚀",title:"아이 놀이 용품",items:[
    {t:"비누방울 (대용량 + 도구)",must:true,kids:true},
    {t:"풍선 & 펌프",kids:true},
    {t:"물풍선 세트",kids:true},
    {t:"배드민턴 세트",kids:true},
    {t:"공 (축구공 / 배구공)",kids:true},
    {t:"줄넘기",kids:true},
    {t:"스프링클러 장난감",kids:true},
    {t:"보드게임 (그늘용)"},
    {t:"색연필 & 스케치북"},
  ]},
  {id:"personal",icon:"🧴",title:"개인 필수품 (각자)",items:[
    {t:"자외선 차단제",must:true,personal:true},
    {t:"선글라스",personal:true},
    {t:"모자",must:true,personal:true},
    {t:"개인 상비약",personal:true},
    {t:"핸드폰 & 보조 배터리",must:true,personal:true},
    {t:"현금 & 카드",must:true,personal:true},
    {t:"물티슈",must:true,personal:true},
    {t:"쓰레기봉투",must:true,personal:true},
  ]},
  {id:"safety",icon:"🩹",title:"안전 / 응급",items:[
    {t:"구급약 & 밴드",must:true},
    {t:"모기 기피제",must:true},
    {t:"모기 패치",must:true},
    {t:"상처 소독약",must:true},
    {t:"아이스팩"},
  ]},
  {id:"etc",icon:"🔧",title:"기타",items:[
    {t:"라이터 & 성냥",must:true},
    {t:"카메라 / 방수 케이스"},
    {t:"선풍기 (휴대용)"},
    {t:"덕트 테이프"},
  ]},
];

const STORE_KEY="camping_checklist_v1";
let state={};
let who="전체";

function load(){
  try{const s=localStorage.getItem(STORE_KEY);if(s)state=JSON.parse(s);}catch(e){state={};}
  render();
}
function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}
  const el=document.getElementById("saveStatus");
  el.textContent="✓ 저장됨 (이 기기)";
  setTimeout(()=>{el.textContent="";},1800);
}
function ikey(catId,t){return catId+"||"+t;}
function getP(k){return(state[k]&&state[k].persons)||{보라:0,승주:0,미정:0};}
function anyAssigned(k){const p=getP(k);return PEOPLE.some(n=>p[n]>=1);}
function allDone(k){const p=getP(k);const a=PEOPLE.filter(n=>p[n]>=1);return a.length>0&&a.every(n=>p[n]===2);}

function setWho(w){
  who=w;
  document.querySelectorAll(".tab").forEach(t=>{
    t.className="tab";
    if(t.dataset.who===w) t.classList.add(w==="전체"?"active-all":`active-${w}`);
  });
  render();
}

function cyclePerson(catId,t,person){
  const k=ikey(catId,t);
  if(!state[k]) state[k]={persons:{보라:0,승주:0,미정:0}};
  if(!state[k].persons) state[k].persons={보라:0,승주:0,미정:0};
  state[k].persons[person]=((state[k].persons[person]||0)+1)%3;
  save();render();
}

function resetAll(){
  if(!confirm("초기화하면 모든 담당 및 체크가 사라집니다. 계속할까요?"))return;
  state={};save();render();
}

function render(){
  const cats=document.getElementById("cats");
  cats.innerHTML="";
  let total=0,totalDone=0;
  const pp={보라:{t:0,d:0},승주:{t:0,d:0},미정:{t:0,d:0}};

  DATA.forEach(cat=>{
    const filteredItems=cat.items.filter(item=>{
      if(who==="전체")return true;
      return getP(ikey(cat.id,item.t))[who]>=1;
    });
    if(who!=="전체"&&filteredItems.length===0)return;

    cat.items.forEach(item=>{
      const k=ikey(cat.id,item.t);
      const p=getP(k);
      PEOPLE.forEach(name=>{if(p[name]>=1){pp[name].t++;if(p[name]===2)pp[name].d++;}});
      if(anyAssigned(k)){total++;if(allDone(k))totalDone++;}
    });

    const showItems=who==="전체"?cat.items:filteredItems;
    const catDone=showItems.filter(i=>allDone(ikey(cat.id,i.t))).length;

    const card=document.createElement("div");
    card.className="cat-card open";

    const itemsHtml=showItems.map(item=>{
      const k=ikey(cat.id,item.t);
      const p=getP(k);
      const isDone=allDone(k);
      const hasAny=anyAssigned(k);
      const doneIcon=isDone?"✅":(hasAny?"🔲":"⬜");

      const badges=[];
      if(item.must)badges.push('<span class="badge badge-must">필수</span>');
      if(item.personal)badges.push('<span class="badge badge-personal">개인별 각자</span>');
      if(item.kids)badges.push('<span class="badge badge-kids">아이용</span>');

      const personBtns=PEOPLE.map(name=>{
        const v=p[name]||0;
        let cls="person-btn ";
        let label=name;
        if(v===0){cls+="idle";}
        else if(v===1){cls+=`sel-${name}`;label=`${name} 담당`;}
        else{cls+=`done-${name}`;label=`${name} ✓챙김`;}
        const dotOpacity=v===0?0.25:1;
        return `<button class="${cls}" onclick="cyclePerson('${cat.id}','${item.t.replace(/'/g,"\\'")}','${name}')">
          <span class="dot" style="background:${DOTCOLORS[name]};opacity:${dotOpacity}"></span>${label}
        </button>`;
      }).join("");

      return `<div class="item">
        <div class="item-left">
          <span class="item-icon">${doneIcon}</span>
          <div class="item-text-col">
            <div class="item-label${isDone?" striked":""}">${item.t}</div>
            ${badges.length?`<div class="item-badges">${badges.join("")}</div>`:""}
          </div>
        </div>
        <div class="assign-col">${personBtns}</div>
      </div>`;
    }).join("");

    card.innerHTML=`
      <div class="cat-head" onclick="const c=this.closest('.cat-card');c.classList.toggle('open');this.querySelector('.cat-chevron').style.transform=c.classList.contains('open')?'rotate(180deg)':'rotate(0deg)'">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-head-title">${cat.title}</span>
        <span class="cat-head-count">${catDone}/${showItems.length} 완료</span>
        <span class="cat-chevron" style="transform:rotate(180deg)">▾</span>
      </div>
      <div class="cat-body">${itemsHtml}</div>`;
    cats.appendChild(card);
  });

  const pct=total?Math.round(totalDone/total*100):0;
  document.getElementById("bar").style.cssText=`width:${pct}%;background:${COLORS[who]}`;
  document.getElementById("stats").innerHTML=
    `<div class="stat">전체 <b>${totalDone}/${total}</b> (${pct}%)</div>`+
    PEOPLE.map(p=>`<div class="stat"><span style="color:${COLORS[p]};font-weight:600">${p}</span> ${pp[p].d}/${pp[p].t}</div>`).join("");
}

load();
</script>
</body>
</html>
